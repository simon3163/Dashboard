name: Orbit safe patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'orbit patch request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Orbit Intel safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          school="const OFF='kids off,school holiday,school holidays,no school,school closed,inset,in-service,in service,holiday';const DEFAULTS={Callum:{enabled:true,start:'09:00',end:'15:00',shortEnd:'15:00',days:[1,2,3,4,5],shortDays:[],offWords:OFF},Tom:{enabled:true,start:'08:00',end:'16:00',shortEnd:'15:00',days:[1,2,3,4,5],shortDays:[3,5],offWords:OFF}};"
          assert school in s, 'School defaults changed or missing — refusing patch'
          assert "localStorage.getItem('orbitSchool'+p)" in s, 'Editable school settings missing — refusing patch'
          assert "localStorage.getItem('orbitManual')" in s, 'Phone-local items missing — refusing patch'
          marker="const I=["
          assert marker in s, 'Intel marker missing'
          if '1a043621edf5a708' not in s:
              item="{owner:'Simon',kind:'info',title:'iCloud+ 2 TB renewal',date:'27 Aug',text:'Apple confirms £8.99 for iCloud+ 2 TB monthly. Next renewal is 27 September 2026.',source:'Gmail',url:'https://mail.google.com/mail/#all/1a043621edf5a708'},"
              s=s.replace(marker,marker+item,1)
              p.write_text(s)
      - name: Commit verified delta
        run: |
          git config user.name "Orbit Sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Orbit sync: add iCloud 2 TB renewal"
          git push
