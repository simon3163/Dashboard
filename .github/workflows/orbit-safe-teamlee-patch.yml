name: Orbit safe Team Lee patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'orbit teamlee patch request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Orbit Team Lee event safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          school="const OFF='kids off,school holiday,school holidays,no school,school closed,inset,in-service,in service,holiday';const DEFAULTS={Callum:{enabled:true,start:'09:00',end:'15:00',shortEnd:'15:00',days:[1,2,3,4,5],shortDays:[],offWords:OFF},Tom:{enabled:true,start:'08:00',end:'16:00',shortEnd:'15:00',days:[1,2,3,4,5],shortDays:[3,5],offWords:OFF}};"
          assert school in s, 'School defaults changed or missing — refusing patch'
          assert "localStorage.getItem('orbitSchool'+p)" in s, 'Editable school settings missing — refusing patch'
          assert "localStorage.getItem('orbitManual')" in s, 'Phone-local items missing — refusing patch'
          if 'Callum Killie Dad too' not in s:
              marker="ev('2026-12-11','11:00','12:00','Meter readings to be submitted before 13th','','Simon','Team Lee');"
              assert marker in s, 'Team Lee insertion marker missing — refusing patch'
              item="ev('2026-11-21','15:00','16:00','Callum Killie Dad too','','Callum','Team Lee');"
              s=s.replace(marker,item+marker,1)
              p.write_text(s)
      - name: Commit verified delta
        run: |
          git config user.name "Orbit Sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Orbit sync: add Callum Killie Team Lee event"
          git push
